<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-logo">⬡</span>
      <h1>{{ settings.acronyme() }}</h1>
      <p>{{ i18n.t('auth.nouveau_titre') }}</p>
    </div>

    <div class="auth-form">
      @if (erreur()) {
        <div class="error-msg">⚠️ {{ erreur() }}</div>
      }
      @if (message()) {
        <div class="success-msg">✅ {{ message() }}</div>
      }

      <div class="field">
        <label>{{ i18n.t('auth.nouveau_password') }}</label>
        <input type="password" [(ngModel)]="motDePasse" placeholder="••••••••" />
      </div>

      <div class="field">
        <label>{{ i18n.t('auth.confirmer') }}</label>
        <input type="password" [(ngModel)]="confirmation" placeholder="••••••••" />
      </div>

      <button class="btn-submit" (click)="onSubmit()" [disabled]="loading() || !token">
        {{ loading() ? i18n.t('auth.enregistrement') : i18n.t('auth.reinitialiser') }}
      </button>

      <a routerLink="/login" class="forgot-link">{{ i18n.t('auth.retour_login') }}</a>
    </div>
  </div>
</div>
