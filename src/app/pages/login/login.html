<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-logo">⬡</span>
      <h1>{{ settings.acronyme() }}</h1>
      <p>{{ i18n.t('auth.espace') }}</p>
    </div>

    <div class="auth-form">
      @if (erreur()) {
        <div class="error-msg">⚠️ {{ erreur() }}</div>
      }

      <div class="field">
        <label>{{ i18n.t('auth.email') }}</label>
        <input type="email" [(ngModel)]="email" placeholder="votre@email.tn" />
      </div>

      <div class="field">
        <label>{{ i18n.t('auth.password') }}</label>
        <input type="password" [(ngModel)]="motDePasse" placeholder="••••••••" />
      </div>

      <button class="btn-submit" (click)="onSubmit()" [disabled]="loading()">
        {{ loading() ? i18n.t('auth.connexion_encours') : i18n.t('auth.se_connecter') }}
      </button>

      <a routerLink="/forgot-password" class="forgot-link">{{ i18n.t('auth.mot_passe_oublie') }}</a>
      
    </div>
  </div>
</div>
